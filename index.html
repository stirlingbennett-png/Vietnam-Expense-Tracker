<title>Vietnam Trip Split</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one narrow phone column — balance card on top, add form, then expenses grouped by day */
:root {
  --bg: #f3f5f2;
  --surface: #ffffff;
  --fg: #17221d;
  --muted: #5f6d66;
  --line: #dde3df;
  --accent: #0f6b55;      /* jade */
  --accent-fg: #ffffff;
  --accent-soft: #e2f0eb;
  --gold: #c8901a;        /* lantern gold */
  --owe: #b8371f;
  --good: #16794f;
  --font: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1613; --surface: #17211d; --fg: #e8efeb; --muted: #97a69f; --line: #26332d;
    --accent: #3fb592; --accent-fg: #06130e; --accent-soft: #183a30; --gold: #e3ad3d;
    --owe: #f07a5f; --good: #4fcf96; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1613; --surface: #17211d; --fg: #e8efeb; --muted: #97a69f; --line: #26332d;
  --accent: #3fb592; --accent-fg: #06130e; --accent-soft: #183a30; --gold: #e3ad3d;
  --owe: #f07a5f; --good: #4fcf96; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.4; }
.wrap { max-width: 560px; margin: 0 auto; padding: 16px; padding-block: 16px 48px; display: grid; gap: 16px; }
.num { font-variant-numeric: tabular-nums; }
h1 { font-size: 15px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin: 0; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
h2 { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.linkbtn { background: none; border: 0; color: var(--accent); font-weight: 600; font-size: 14px; padding: 4px 0; letter-spacing: 0; text-transform: none; }

/* Balance card */
.balance { background: var(--accent); color: var(--accent-fg); border-radius: 20px; padding: 20px; display: grid; gap: 14px; }
.balance .who { font-size: 15px; font-weight: 500; opacity: .9; }
.balance .amt { font-size: clamp(32px, 10vw, 44px); font-weight: 800; letter-spacing: -.02em; line-height: 1.05; }
.balance .conv { font-size: 15px; opacity: .85; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; border-top: 1px solid color-mix(in srgb, var(--accent-fg) 25%, transparent); padding-top: 12px; }
.stats div { min-width: 0; }
.stats small { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stats b { font-size: 15px; font-weight: 700; }
.settlebtn { justify-self: start; background: var(--accent-fg); color: var(--accent); border: 0; border-radius: 999px; padding: 9px 16px; font-weight: 700; font-size: 14px; }

/* Form */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 14px; }
label.f { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
input[type=text], input[type=date], input[inputmode] {
  font: inherit; font-size: 17px; color: var(--fg); background: var(--bg); border: 1px solid var(--line);
  border-radius: 10px; padding: 12px; width: 100%; min-width: 0;
}
.amountrow { position: relative; }
.amountrow input { font-size: 26px; font-weight: 700; padding-right: 44px; }
.amountrow span { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 22px; font-weight: 700; color: var(--muted); }
.hint { font-size: 13px; color: var(--muted); font-weight: 500; min-height: 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 999px; padding: 8px 13px; font-size: 14px; font-weight: 500; }
.chip[aria-pressed=true] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--bg); padding: 4px; border-radius: 12px; border: 1px solid var(--line); }
.seg.three { grid-template-columns: 1fr 1fr 1fr; }
.seg button { border: 0; background: transparent; color: var(--fg); padding: 10px 6px; border-radius: 9px; font-weight: 600; font-size: 14px; line-height: 1.2; }
.seg button[aria-pressed=true] { background: var(--surface); color: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.primary { background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 12px; padding: 15px; font-weight: 700; font-size: 17px; width: 100%; }
.primary:disabled { opacity: .5; cursor: default; }
.formfoot { display: flex; gap: 10px; }
.formfoot .primary { flex: 1; }
.ghost { background: transparent; border: 1px solid var(--line); color: var(--fg); border-radius: 12px; padding: 15px 16px; font-weight: 600; }
.danger { background: transparent; border: 1px solid var(--owe); color: var(--owe); border-radius: 12px; padding: 15px 16px; font-weight: 600; }
.formtitle { display: flex; justify-content: space-between; align-items: baseline; }

/* List */
.day { display: grid; gap: 6px; }
.dayhead { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-weight: 600; padding: 0 4px; }
.items { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.item { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; width: 100%; text-align: left; background: none; border: 0; color: var(--fg); border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.ico { width: 36px; height: 36px; border-radius: 10px; background: var(--accent-soft); display: grid; place-items: center; font-size: 13px; font-weight: 800; color: var(--accent); }
.item.pay .ico { background: color-mix(in srgb, var(--gold) 20%, transparent); color: var(--gold); }
.item .t { min-width: 0; }
.item .t b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .t small { color: var(--muted); font-size: 13px; }
.item .a { text-align: right; font-weight: 700; }
.item .a small { display: block; color: var(--muted); font-weight: 500; font-size: 12px; }
.empty { text-align: center; color: var(--muted); padding: 28px 16px; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); }
.banner { background: color-mix(in srgb, var(--owe) 12%, var(--surface)); border: 1px solid var(--owe); color: var(--fg); border-radius: var(--r); padding: 12px 14px; font-size: 14px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 14px; z-index: 10; }
.settings { display: grid; gap: 12px; }
.settings .row2 input { font-size: 16px; }
@media (prefers-reduced-motion: no-preference) { .chip, .seg button, .item { transition: background .15s, color .15s; } }
</style>

<div class="wrap">
  <h1><span>Vietnam Trip Split</span><button class="linkbtn" id="settingsBtn" type="button">Settings</button></h1>

  <div class="banner" id="banner" hidden></div>

  <section class="balance" aria-live="polite">
    <div class="who" id="balWho">Loading…</div>
    <div class="amt num" id="balAmt">—</div>
    <div class="conv num" id="balConv"></div>
    <div class="stats num">
      <div><small>Trip total</small><b id="stTotal">0 ₫</b></div>
      <div><small id="stAName">A paid</small><b id="stA">0 ₫</b></div>
      <div><small id="stBName">B paid</small><b id="stB">0 ₫</b></div>
    </div>
    <button class="settlebtn" id="settleBtn" type="button" hidden>Record payment</button>
  </section>

  <section class="card settings" id="settingsCard" hidden>
    <div class="formtitle"><h2>Settings</h2><button class="linkbtn" id="settingsClose" type="button">Done</button></div>
    <div class="row2">
      <label class="f">Person 1<input type="text" id="nameA" autocomplete="off"></label>
      <label class="f">Person 2<input type="text" id="nameB" autocomplete="off"></label>
    </div>
    <div class="row2">
      <label class="f">Home currency<input type="text" id="cur" maxlength="4" autocomplete="off"></label>
      <label class="f">₫ per 1 unit<input type="text" inputmode="numeric" id="rate" autocomplete="off"></label>
    </div>
    <div class="hint">Names and rate are shared. Amounts are always stored in đồng.</div>
    <button class="primary" id="saveSettings" type="button">Save settings</button>
  </section>

  <form class="card" id="form" autocomplete="off">
    <div class="formtitle"><h2 id="formTitle">Add expense</h2><button class="linkbtn" id="cancelEdit" type="button" hidden>Cancel</button></div>

    <label class="f">Amount
      <div class="amountrow"><input id="amount" inputmode="numeric" placeholder="350.000" aria-describedby="amtHint"><span>₫</span></div>
    </label>
    <div class="hint num" id="amtHint">Tip: type 350k or 1.2m</div>
    <div class="chips" id="quick">
      <button type="button" class="chip" data-add="50000">+50k</button>
      <button type="button" class="chip" data-add="100000">+100k</button>
      <button type="button" class="chip" data-add="500000">+500k</button>
      <button type="button" class="chip" data-add="1000000">+1m</button>
    </div>

    <label class="f">What for<input type="text" id="desc" placeholder="Phở at Bún Chả Hương Liên" maxlength="80"></label>

    <div class="chips" id="cats" role="group" aria-label="Category"></div>

    <div class="f"><span>Who paid</span>
      <div class="seg" id="paidBy">
        <button type="button" data-v="a" aria-pressed="true">A</button>
        <button type="button" data-v="b" aria-pressed="false">B</button>
      </div>
    </div>

    <div class="f"><span>Split</span>
      <div class="seg three" id="split">
        <button type="button" data-v="half" aria-pressed="true">50 / 50</button>
        <button type="button" data-v="other" aria-pressed="false" id="splitOther">All for B</button>
        <button type="button" data-v="self" aria-pressed="false" id="splitSelf">Just A's</button>
      </div>
    </div>

    <label class="f">Date<input type="date" id="date"></label>

    <div class="formfoot">
      <button class="danger" id="delBtn" type="button" hidden>Delete</button>
      <button class="primary" id="submit" type="submit">Add expense</button>
    </div>
  </form>

  <section class="card" id="payCard" hidden>
    <div class="formtitle"><h2>Record payment</h2><button class="linkbtn" id="payCancel" type="button">Cancel</button></div>
    <div class="hint" id="payText"></div>
    <label class="f">Amount sent
      <div class="amountrow"><input id="payAmount" inputmode="numeric"><span>₫</span></div>
    </label>
    <button class="primary" id="paySave" type="button">Save payment</button>
  </section>

  <section style="display:grid;gap:14px">
    <div class="formtitle"><h2>Expenses</h2><span class="hint num" id="count"></span></div>
    <div id="list"><div class="empty">Loading shared expenses…</div></div>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const CATS = [
  { id: "food", label: "Food", ab: "FD" },
  { id: "drinks", label: "Drinks", ab: "DR" },
  { id: "hotel", label: "Hotel", ab: "HT" },
  { id: "transport", label: "Grab / transport", ab: "TR" },
  { id: "activity", label: "Activities", ab: "AC" },
  { id: "shopping", label: "Shopping", ab: "SH" },
  { id: "other", label: "Other", ab: "··" },
];
const $ = (id) => document.getElementById(id);
const vnd = (n) => Math.round(n).toLocaleString("vi-VN") + " ₫";
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };

let settings = { nameA: "Stirling", nameB: "Ryan", currency: "USD", rate: 26000 };
let expenses = [];
let db = null;
let editingId = null;
let form = { paidBy: "a", split: "half", cat: "food" };

try { const me = localStorage.getItem("me"); if (me === "a" || me === "b") form.paidBy = me; } catch (e) {}

function nm(k) { return k === "a" ? settings.nameA : settings.nameB; }
function other(k) { return k === "a" ? "b" : "a"; }
function conv(n) { const r = Number(settings.rate) || 0; if (!r) return ""; const v = n / r; return "≈ " + v.toLocaleString(undefined, { maximumFractionDigits: v < 100 ? 2 : 0 }) + " " + (settings.currency || ""); }

// "350k" -> 350000, "1.2m" -> 1200000, "350.000" -> 350000
function parseAmt(s) {
  s = String(s || "").trim().toLowerCase().replace(/\s|₫|đ|vnd/g, "");
  if (!s) return 0;
  let mult = 1;
  if (/[k]$/.test(s)) { mult = 1e3; s = s.slice(0, -1); }
  else if (/(m|tr)$/.test(s)) { mult = 1e6; s = s.replace(/(m|tr)$/, ""); }
  if (mult > 1) s = s.replace(",", ".");
  else s = s.replace(/[.,]/g, "");
  const n = parseFloat(s);
  return isFinite(n) ? Math.round(n * mult) : 0;
}

// Positive = B owes A
function balance() {
  let owed = 0, paidA = 0, paidB = 0, total = 0;
  for (const e of expenses) {
    const amt = Number(e.amount) || 0;
    const sign = e.paidBy === "a" ? 1 : -1;
    if (e.kind === "payment") { owed += sign * amt; continue; }
    if (e.paidBy === "a") paidA += amt; else paidB += amt;
    total += amt;
    if (e.split === "half") owed += sign * amt / 2;
    else if (e.split === "other") owed += sign * amt;
  }
  return { owed, paidA, paidB, total };
}

function renderBalance() {
  const { owed, paidA, paidB, total } = balance();
  $("stTotal").textContent = vnd(total);
  $("stAName").textContent = settings.nameA + " paid";
  $("stBName").textContent = settings.nameB + " paid";
  $("stA").textContent = vnd(paidA);
  $("stB").textContent = vnd(paidB);
  const abs = Math.round(Math.abs(owed));
  if (abs < 1000) {
    $("balWho").textContent = expenses.length ? "You're even" : "No expenses yet";
    $("balAmt").textContent = "All square";
    $("balConv").textContent = "";
    $("settleBtn").hidden = true;
  } else {
    const debtor = owed > 0 ? "b" : "a";
    $("balWho").textContent = nm(debtor) + " owes " + nm(other(debtor));
    $("balAmt").textContent = vnd(abs);
    $("balConv").textContent = conv(abs);
    $("settleBtn").hidden = false;
    $("settleBtn").textContent = "Record " + nm(debtor) + "'s payment";
  }
}

function renderForm() {
  for (const b of $("paidBy").children) { b.textContent = nm(b.dataset.v); b.setAttribute("aria-pressed", b.dataset.v === form.paidBy); }
  $("splitOther").textContent = "All for " + nm(other(form.paidBy));
  $("splitSelf").textContent = "Just " + nm(form.paidBy) + "'s";
  for (const b of $("split").children) b.setAttribute("aria-pressed", b.dataset.v === form.split);
  for (const b of $("cats").children) b.setAttribute("aria-pressed", b.dataset.v === form.cat);
  const n = parseAmt($("amount").value);
  if (n) {
    let line = vnd(n) + "  " + conv(n);
    if (form.split === "half") line += " · each pays " + vnd(n / 2);
    $("amtHint").textContent = line;
  } else $("amtHint").textContent = "Tip: type 350k or 1.2m";
}

function splitLabel(e) {
  if (e.kind === "payment") return nm(e.paidBy) + " paid " + nm(other(e.paidBy));
  const p = nm(e.paidBy);
  if (e.split === "half") return p + " paid · split 50/50";
  if (e.split === "other") return p + " paid · all for " + nm(other(e.paidBy));
  return p + " paid · just " + p + "'s";
}

function renderList() {
  const list = $("list");
  list.textContent = "";
  const real = expenses.filter(e => e.kind !== "payment").length;
  $("count").textContent = real ? real + (real === 1 ? " expense" : " expenses") : "";
  if (!expenses.length) {
    const d = document.createElement("div");
    d.className = "empty";
    d.textContent = db ? "Nothing logged yet. Add the first purchase above — hotel, Grab, bánh mì, anything." : "Shared expenses appear here once you're signed in.";
    list.appendChild(d);
    return;
  }
  const sorted = [...expenses].sort((x, y) => (y.date || "").localeCompare(x.date || "") || (y.createdAt || 0) - (x.createdAt || 0));
  const days = new Map();
  for (const e of sorted) { const k = e.date || "—"; if (!days.has(k)) days.set(k, []); days.get(k).push(e); }
  const wrap = document.createElement("div");
  wrap.style.cssText = "display:grid;gap:16px";
  for (const [day, items] of days) {
    const sec = document.createElement("div"); sec.className = "day";
    const head = document.createElement("div"); head.className = "dayhead num";
    const dl = document.createElement("span");
    const dt = new Date(day + "T12:00:00");
    dl.textContent = isNaN(dt) ? day : dt.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
    const dsum = document.createElement("span");
    dsum.textContent = vnd(items.filter(e => e.kind !== "payment").reduce((s, e) => s + (Number(e.amount) || 0), 0));
    head.append(dl, dsum);
    const box = document.createElement("div"); box.className = "items";
    for (const e of items) {
      const b = document.createElement("button"); b.type = "button";
      b.className = "item" + (e.kind === "payment" ? " pay" : "");
      const cat = CATS.find(c => c.id === e.cat) || CATS[CATS.length - 1];
      const ico = document.createElement("span"); ico.className = "ico"; ico.textContent = e.kind === "payment" ? "₫" : cat.ab;
      const t = document.createElement("span"); t.className = "t";
      const tb = document.createElement("b"); tb.textContent = e.kind === "payment" ? "Payment" : (e.desc || cat.label);
      const ts = document.createElement("small"); ts.textContent = splitLabel(e);
      t.append(tb, ts);
      const a = document.createElement("span"); a.className = "a num";
      a.textContent = vnd(e.amount);
      const as = document.createElement("small"); as.textContent = conv(Number(e.amount) || 0);
      a.appendChild(as);
      b.append(ico, t, a);
      b.addEventListener("click", () => startEdit(e));
      box.appendChild(b);
    }
    sec.append(head, box);
    wrap.appendChild(sec);
  }
  list.appendChild(wrap);
}

function render() { renderBalance(); renderForm(); renderList(); }

let toastT;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 2200); }
function banner(msg) { $("banner").textContent = msg; $("banner").hidden = !msg; }

function resetForm() {
  editingId = null;
  $("amount").value = ""; $("desc").value = ""; $("date").value = today();
  form.split = "half"; form.cat = "food";
  try { const me = localStorage.getItem("me"); if (me === "a" || me === "b") form.paidBy = me; } catch (e) {}
  $("formTitle").textContent = "Add expense"; $("submit").textContent = "Add expense";
  $("cancelEdit").hidden = true; $("delBtn").hidden = true; delArmed = false; $("delBtn").textContent = "Delete";
  renderForm();
}

function startEdit(e) {
  if (e.kind === "payment") { editingId = e.id; openPay(e); return; }
  editingId = e.id;
  $("amount").value = Number(e.amount).toLocaleString("vi-VN");
  $("desc").value = e.desc || "";
  $("date").value = e.date || today();
  form.paidBy = e.paidBy; form.split = e.split; form.cat = e.cat || "other";
  $("formTitle").textContent = "Edit expense"; $("submit").textContent = "Save changes";
  $("cancelEdit").hidden = false; $("delBtn").hidden = false;
  renderForm();
  $("form").scrollIntoView({ behavior: "smooth", block: "start" });
}

// Build category chips
for (const c of CATS) {
  const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.dataset.v = c.id; b.textContent = c.label;
  b.addEventListener("click", () => { form.cat = c.id; renderForm(); });
  $("cats").appendChild(b);
}
for (const b of $("paidBy").children) b.addEventListener("click", () => {
  form.paidBy = b.dataset.v;
  try { if (!editingId) localStorage.setItem("me", form.paidBy); } catch (e) {}
  renderForm();
});
for (const b of $("split").children) b.addEventListener("click", () => { form.split = b.dataset.v; renderForm(); });
for (const b of $("quick").children) b.addEventListener("click", () => {
  $("amount").value = (parseAmt($("amount").value) + Number(b.dataset.add)).toLocaleString("vi-VN"); renderForm();
});
$("amount").addEventListener("input", renderForm);
$("amount").addEventListener("blur", () => { const n = parseAmt($("amount").value); if (n) $("amount").value = n.toLocaleString("vi-VN"); });
$("cancelEdit").addEventListener("click", resetForm);

let delArmed = false;
$("delBtn").addEventListener("click", async () => {
  if (!delArmed) { delArmed = true; $("delBtn").textContent = "Tap to confirm"; return; }
  if (!db || !editingId) return;
  try { await db.collection("expenses").doc(editingId).delete(); toast("Deleted"); resetForm(); }
  catch (err) { toast("Couldn't delete: " + (err.message || err.code)); }
});

$("form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const amount = parseAmt($("amount").value);
  if (!amount) { toast("Enter an amount"); $("amount").focus(); return; }
  if (!db) { toast("Sign in to claude.ai to save"); return; }
  const doc = {
    kind: "expense", amount, desc: $("desc").value.trim(), cat: form.cat,
    paidBy: form.paidBy, split: form.split, date: $("date").value || today(),
  };
  $("submit").disabled = true;
  try {
    if (editingId) {
      const old = expenses.find(e => e.id === editingId);
      await db.collection("expenses").doc(editingId).set({ ...doc, createdAt: old?.createdAt || Date.now() });
      toast("Saved");
    } else {
      await db.collection("expenses").add({ ...doc, createdAt: Date.now() });
      toast("Added " + vnd(amount));
    }
    resetForm();
  } catch (err) {
    toast(err.code === "invalid_argument" ? "You don't have edit access — ask the owner to share as Editor" : "Couldn't save, try again");
  } finally { $("submit").disabled = false; }
});

// Payments
let payFrom = "b";
function openPay(existing) {
  const { owed } = balance();
  if (existing) { payFrom = existing.paidBy; $("payAmount").value = Number(existing.amount).toLocaleString("vi-VN"); }
  else { payFrom = owed > 0 ? "b" : "a"; $("payAmount").value = Math.round(Math.abs(owed)).toLocaleString("vi-VN"); }
  $("payText").textContent = nm(payFrom) + " sends money to " + nm(other(payFrom)) + " (bank transfer, Wise, cash…). Logging it zeroes out the balance.";
  $("paySave").textContent = existing ? "Save payment" : "Save payment";
  $("payCard").hidden = false;
  $("payCard").scrollIntoView({ behavior: "smooth", block: "start" });
}
$("settleBtn").addEventListener("click", () => { editingId = null; openPay(null); });
$("payCancel").addEventListener("click", () => { $("payCard").hidden = true; editingId = null; });
$("paySave").addEventListener("click", async () => {
  const amount = parseAmt($("payAmount").value);
  if (!amount || !db) return;
  const doc = { kind: "payment", amount, paidBy: payFrom, desc: "Payment", date: today(), cat: "other", split: "other" };
  try {
    if (editingId) await db.collection("expenses").doc(editingId).set({ ...doc, createdAt: Date.now() });
    else await db.collection("expenses").add({ ...doc, createdAt: Date.now() });
    $("payCard").hidden = true; editingId = null; toast("Payment logged");
  } catch (err) { toast("Couldn't save payment"); }
});

// Settings
$("settingsBtn").addEventListener("click", () => {
  $("nameA").value = settings.nameA; $("nameB").value = settings.nameB;
  $("cur").value = settings.currency; $("rate").value = settings.rate;
  $("settingsCard").hidden = !$("settingsCard").hidden;
});
$("settingsClose").addEventListener("click", () => ($("settingsCard").hidden = true));
$("saveSettings").addEventListener("click", async () => {
  const next = {
    nameA: $("nameA").value.trim() || "Person 1", nameB: $("nameB").value.trim() || "Person 2",
    currency: $("cur").value.trim().toUpperCase(), rate: parseAmt($("rate").value) || 0,
  };
  if (!db) { toast("Sign in to save"); return; }
  try { await db.doc("trip/settings").set(next); $("settingsCard").hidden = true; toast("Settings saved"); }
  catch (err) { toast("Couldn't save settings"); }
});

$("date").value = today();
render();

(async () => {
  db = await window.claude?.use?.("db") ?? null;
  if (!db) { banner("Open this page signed in to claude.ai to see and add shared expenses."); render(); return; }
  db.doc("trip/settings").onSnapshot(s => {
    if (s.exists) settings = { ...settings, ...s.data() };
    render();
  }, () => {});
  db.collection("expenses").onSnapshot(snap => {
    expenses = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, (err) => { banner("Lost connection to shared data. Reload the page."); });
})();
</script>
